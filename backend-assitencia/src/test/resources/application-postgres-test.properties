# Use somente um banco PostgreSQL dedicado a testes. Nunca aponte TEST_DB_URL para produção.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend-assitencia/.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Atualiza o esquema sem apagar tabelas ou registros existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=false

TEST_ADMIN_EMAIL=${ADMIN_EMAIL:admin@teste.com}
TEST_ADMIN_PASSWORD=${ADMIN_PASSWORD:admin123456}