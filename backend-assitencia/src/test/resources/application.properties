spring.application.name=backend-assitencia-test
spring.config.import=optional:file:./.env[.properties],optional:file:./backend-assitencia/.env[.properties]

# In-memory H2 database in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:ass_tec_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Security & Crypto keys injected via @Value
api.security.token.secret=${PALAVRA_SECRETA:segredo-muito-seguro-para-os-testes-unitarios-32chars}
api.security.expiration.time=${JWT_EXPIRATION_TIME:3600}
app.criptografia.senha=${CRYPTO_SENHA:senha-teste-segura-123456}
app.criptografia.salt=${CRYPTO_SALT:5c0744940b5c369b}
app.criptografia.chave-hmac=${CRYPTO_CHAVE_HMAC:chave-hmac-teste-segura-123456}

# Environment variables matching @Value
ADMIN_EMAIL=${ADMIN_EMAIL:admin@teste.com}
ADMIN_PASSWORD=${ADMIN_PASSWORD:admin123456}
