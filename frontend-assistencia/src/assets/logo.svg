<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none">
  <defs>
    <linearGradient id="tfGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="tfGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Tech Shield / Chip Icon -->
  <g transform="translate(4, 5)">
    <!-- Base Rounded Badge -->
    <rect x="1" y="1" width="38" height="38" rx="11" fill="url(#tfGlow)" stroke="url(#tfGradient)" stroke-width="2" />
    
    <!-- Circuit Paths -->
    <path d="M12 20H8" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 20H32" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 12V8" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 32V28" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Hardware Microchip Core -->
    <rect x="13" y="13" width="14" height="14" rx="4" fill="url(#tfGradient)" filter="url(#shadowFilter)"/>
    <path d="M17 18L19.5 21L23 16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Circuit Dots -->
    <circle cx="7" cy="20" r="1.5" fill="#06B6D4" />
    <circle cx="33" cy="20" r="1.5" fill="#06B6D4" />
    <circle cx="20" cy="7" r="1.5" fill="#2563EB" />
  </g>

  <!-- Typography -->
  <text x="52" y="27" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="21" fill="#0F172A" letter-spacing="-0.5">
    Tech<tspan fill="url(#tfGradient)">Fix</tspan>
  </text>
  <text x="53" y="39" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#64748B" letter-spacing="1.8">
    ASSISTÊNCIA TÉCNICA
  </text>
</svg>